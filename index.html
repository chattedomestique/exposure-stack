<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0f17" />
    <meta
      name="description"
      content="Merge three bracketed exposures into one clean image — privately, in your browser."
    />
    <title>Exposure Stack — clean exposure merging in your browser</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true"></span>
          <span class="brand-name">Exposure&nbsp;Stack</span>
        </div>
        <p class="tagline">Three exposures in. One clean frame out. Nothing leaves your device.</p>
      </header>

      <main>
        <section class="slots" id="slots" aria-label="Exposure inputs">
          <!-- Slot cards are injected by main.ts -->
        </section>

        <section class="controls">
          <div class="control-row">
            <label class="switch">
              <input type="checkbox" id="align" checked />
              <span>Auto-align (MTB)</span>
            </label>
            <label class="slider">
              <span>Contrast</span>
              <input type="range" id="w-contrast" min="0" max="2" step="0.1" value="1" />
            </label>
            <label class="slider">
              <span>Saturation</span>
              <input type="range" id="w-saturation" min="0" max="2" step="0.1" value="1" />
            </label>
            <label class="slider">
              <span>Exposure</span>
              <input type="range" id="w-exposure" min="0" max="2" step="0.1" value="1" />
            </label>
          </div>
          <div class="actions">
            <button id="merge" class="primary" disabled>Merge exposures</button>
            <button id="reset" class="ghost">Reset</button>
          </div>
          <p class="status" id="status" role="status" aria-live="polite">
            Add three bracketed exposures to begin.
          </p>
        </section>

        <section class="result" id="result" hidden aria-label="Merged result">
          <div class="result-head">
            <h2>Merged result</h2>
            <div class="result-actions">
              <button id="download" class="primary">Download PNG</button>
              <button id="download-jpg" class="ghost">JPEG</button>
            </div>
          </div>
          <div class="canvas-wrap">
            <canvas id="output"></canvas>
          </div>
        </section>
      </main>

      <footer class="foot">
        <span>Mertens–Kautz–Van Reeth exposure fusion · MTB alignment</span>
        <span class="dot">·</span>
        <span>100% on-device — your photos are never uploaded</span>
      </footer>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
