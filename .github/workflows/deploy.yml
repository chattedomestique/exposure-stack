name: Deploy to GitHub Pages

# Build validates every PR; deploy only happens from main (the github-pages
# environment only permits deployments from the default branch).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Allow the workflow to publish to GitHub Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# One run at a time per ref; a PR build never cancels a live main deploy.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# Skip Playwright's browser download during npm ci — it isn't needed to build.
env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

jobs:
  # Verify gates deploy: lint + typecheck + tests + build (playbook §11.2 / N10).
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm run build
      - run: test -s dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: verify
    # Deploy only from main; branches/PRs stop after the verify job.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
